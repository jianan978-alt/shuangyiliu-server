<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================== DATA ============================== */
const DISCIPLINES = [
  { id: "chem", name: "化学学科" },
  { id: "chem_eng", name: "化工学科" },
];

const DEADLINE = new Date("2026-09-11T23:59:59+08:00");
const API = ""; // same-origin

/* ============================== HELPERS ============================== */

function useNow(intervalMs = 1000) {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), intervalMs);
    return () => clearInterval(t);
  }, [intervalMs]);
  return now;
}

function formatCountdown(now) {
  const diff = DEADLINE.getTime() - now.getTime();
  if (diff <= 0) return { expired: true, d: 0, h: 0, m: 0, s: 0 };
  const s = Math.floor(diff / 1000) % 60;
  const m = Math.floor(diff / (1000 * 60)) % 60;
  const h = Math.floor(diff / (1000 * 60 * 60)) % 24;
  const d = Math.floor(diff / (1000 * 60 * 60 * 24));
  return { expired: false, d, h, m, s };
}

function ownersFor(ind, discipline) {
  return (ind.owner_by_discipline && ind.owner_by_discipline[discipline]) || ind.owner_list || [];
}

function hasListItem(ind) {
  return ind.items.some((it) => it.is_list);
}

function humanFileSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(2) + " MB";
}

/* ============================== API CLIENT ============================== */

async function apiGetIndicators() {
  const r = await fetch(`${API}/api/indicators`);
  if (!r.ok) throw new Error("failed to load indicators");
  return r.json();
}

async function apiGetPeople(discipline) {
  const r = await fetch(`${API}/api/people/${discipline}`);
  if (!r.ok) throw new Error("failed to load people");
  return r.json();
}

async function apiGetState(discipline) {
  const r = await fetch(`${API}/api/state/${discipline}`);
  if (!r.ok) throw new Error("failed to load state");
  return r.json();
}

async function apiGetProgress(discipline) {
  const r = await fetch(`${API}/api/progress/${discipline}`);
  if (!r.ok) throw new Error("failed to load progress");
  return r.json();
}

async function apiSaveField(discipline, indicatorId, itemIdx, value, person) {
  const r = await fetch(`${API}/api/field/${discipline}/${indicatorId}/${itemIdx}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value, person }),
  });
  if (!r.ok) throw new Error("failed to save field");
  return r.json();
}

async function apiUploadFiles(discipline, indicatorId, kind, fileList, person) {
  const form = new FormData();
  Array.from(fileList).forEach((f) => form.append("files", f));
  form.append("person", person || "");
  const r = await fetch(`${API}/api/upload/${discipline}/${indicatorId}/${kind}`, {
    method: "POST",
    body: form,
  });
  if (!r.ok) throw new Error("upload failed");
  return r.json();
}

async function apiDeleteFile(fileId) {
  const r = await fetch(`${API}/api/file/${fileId}`, { method: "DELETE" });
  if (!r.ok) throw new Error("delete failed");
  return r.json();
}

function exportUrl(discipline) {
  return `${API}/api/export/${discipline}`;
}

/* ============================== APP-WIDE DATA HOOK ============================== */

function useIndicators() {
  const [indicators, setIndicators] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    apiGetIndicators()
      .then((data) => {
        if (!cancelled) setIndicators(data.indicators);
      })
      .catch((e) => {
        if (!cancelled) setError("无法连接到服务器，请检查网络或稍后重试");
      });
    return () => {
      cancelled = true;
    };
  }, []);

  return { indicators, error };
}

/* ============================== DISCIPLINE STATE (fields + files, polled) ============================== */

function useDisciplineState(discipline) {
  const [fields, setFields] = useState({});
  const [evidence, setEvidence] = useState({});
  const [listFiles, setListFiles] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState(null);

  const reload = useCallback(async () => {
    if (!discipline) return;
    try {
      const data = await apiGetState(discipline);
      setFields(data.fields || {});
      setEvidence(data.evidence || {});
      setListFiles(data.listFiles || {});
      setLoaded(true);
      setError(null);
    } catch (e) {
      setError("加载数据失败，请检查网络连接");
      setLoaded(true);
    }
  }, [discipline]);

  useEffect(() => {
    setLoaded(false);
    reload();
    // Poll periodically so multiple people online at once see each other's updates.
    const t = setInterval(reload, 8000);
    return () => clearInterval(t);
  }, [discipline, reload]);

  return { fields, evidence, listFiles, loaded, error, reload };
}

/* ============================== PROGRESS CALC (client-side mirror of server logic) ============================== */

function computeIndicatorStatus(ind, fields, evidence, listFiles) {
  const textItems = ind.items.filter((it) => !it.is_list);
  let textDone = 0;
  textItems.forEach((it) => {
    const idx = ind.items.indexOf(it);
    const val = fields[`${ind.id}:${idx}`];
    if (typeof val === "string" && val.trim().length > 0) textDone += 1;
  });
  const needsList = hasListItem(ind);
  const lFiles = needsList ? listFiles[ind.id] || [] : [];
  const listDone = !needsList || lFiles.length > 0;
  const eFiles = evidence[ind.id] || [];
  const evidenceDone = eFiles.length > 0;

  const total = textItems.length + (needsList ? 1 : 0) + 1;
  const done = textDone + (needsList ? (listDone ? 1 : 0) : 0) + (evidenceDone ? 1 : 0);

  return { done, total, textDone, textTotal: textItems.length, listDone, needsList, evidenceDone };
}

function computePersonProgress(indicators, person, discipline, fields, evidence, listFiles) {
  const inds = indicators.filter((ind) => ownersFor(ind, discipline).includes(person));
  let done = 0;
  let total = 0;
  inds.forEach((ind) => {
    const s = computeIndicatorStatus(ind, fields, evidence, listFiles);
    done += s.done;
    total += s.total;
  });
  return { done, total, indicatorCount: inds.length };
}

        background: cd.expired
          ? "linear-gradient(90deg,#7a1f1f,#4a1010)"
          : urgent
          ? "linear-gradient(90deg,#8a1f1f,#c23b22)"
          : "linear-gradient(90deg,#1f3a5f,#173056)",
        color: "#fff",
        padding: "14px 20px",

        <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>

}

/* ============================== UI: PROGRESS DASHBOARD (+ export) ============================== */

function ProgressDashboard({ indicators, discipline, onBack, onSelectPerson }) {
  const [progress, setProgress] = useState(null);
  const [people, setPeople] = useState([]);
  const [exporting, setExporting] = useState(false);
  const disciplineName = DISCIPLINES.find((d) => d.id === discipline)?.name || "";

  const reload = useCallback(() => {
    apiGetProgress(discipline).then(setProgress);
    apiGetPeople(discipline).then((d) => setPeople(d.people || []));
  }, [discipline]);

  useEffect(() => {
    reload();
    const t = setInterval(reload, 6000);
    return () => clearInterval(t);
  }, [reload]);

  if (!progress) {
    return <div style={{ padding: 60, textAlign: "center" }}>加载进度中...</div>;
  }

  const overallPct = progress.overall.total
    ? Math.round((progress.overall.done / progress.overall.total) * 100)
    : 0;

  const perPersonList = people
    .map((p) => ({ person: p, ...(progress.perPerson[p] || { done: 0, total: 0, indicatorCount: 0 }) }))
    .sort((a, b) => {
      const ra = a.total ? a.done / a.total : 0;
      const rb = b.total ? b.done / b.total : 0;
      return ra - rb;
    });

  const handleExport = () => {
    setExporting(true);
    const a = document.createElement("a");
    a.href = exportUrl(discipline);
    a.click();
    setTimeout(() => setExporting(false), 1500);
  };

  return (
    <div
      style={{
        maxWidth: 980,
        margin: "0 auto",
        padding: "32px 20px 60px",
        fontFamily: "'Noto Sans SC','PingFang SC',sans-serif",
      }}
    >

        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          marginBottom: 24,
          flexWrap: "wrap",
          gap: 10,
        }}
      >
        <button onClick={onBack} style={backBtnStyle}>
          ← 返回
        </button>
        <h2 style={{ margin: 0, fontSize: 20, color: "#1a2540" }}>
          {disciplineName} · 填报总进度
        </h2>
        <button
          onClick={handleExport}
          disabled={exporting}
          style={{
            background: "#1a8a4a",
            color: "#fff",
            border: "none",
            borderRadius: 8,
            padding: "10px 18px",
            fontSize: 13.5,
            fontWeight: 700,
            cursor: exporting ? "default" : "pointer",
            opacity: exporting ? 0.7 : 1,
            display: "flex",
            alignItems: "center",
            gap: 6,
          }}
        >
          {exporting ? "正在打包..." : "⬇ 导出全部材料（按指标分类打包）"}
        </button>
      </div>

      <div
        style={{
          background: "#fff",
          border: "1px solid #e6e9ef",
          borderRadius: 14,
          padding: "24px 28px",
          marginBottom: 24,
          boxShadow: "0 1px 3px rgba(20,30,50,0.04)",
        }}
      >
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "baseline",
            marginBottom: 12,
          }}
        >
          <div style={{ fontSize: 14, color: "#5c6b82" }}>总体完成情况</div>
          <div style={{ fontSize: 26, fontWeight: 800, color: "#1a2540" }}>
            {overallPct}%
            <span style={{ fontSize: 13, fontWeight: 400, color: "#8a94a6", marginLeft: 8 }}>
              {progress.overall.done} / {progress.overall.total} 项已完成
            </span>
          </div>
        </div>
        <ProgressBar pct={overallPct} height={12} />
      </div>

      <div style={{ fontSize: 14, color: "#5c6b82", marginBottom: 12, fontWeight: 600 }}>
        按负责人查看
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {perPersonList.map(({ person, done, total, indicatorCount }) => {
          const pct = total ? Math.round((done / total) * 100) : 0;
          return (
            <button
              key={person}
              onClick={() => onSelectPerson(person)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 16,
                background: "#fff",
                border: "1px solid #e6e9ef",
                borderRadius: 12,
                padding: "14px 18px",
                cursor: "pointer",
                textAlign: "left",
              }}
            >
              <div style={{ width: 90, fontWeight: 700, color: "#1a2540", flexShrink: 0 }}>
                {person}
              </div>
              <div style={{ flex: 1 }}>
                <ProgressBar pct={pct} height={8} />
              </div>
              <div
                style={{
                  width: 130,
                  textAlign: "right",
                  fontSize: 13,
                  color: pct === 100 ? "#1a8a4a" : "#5c6b82",
                  flexShrink: 0,
                }}
              >
                {done}/{total} · {pct}%
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ProgressBar({ pct, height = 8 }) {
  const color = pct === 100 ? "#1a8a4a" : pct >= 50 ? "#2f5fd9" : "#e8a13a";
  return (
    <div style={{ width: "100%", height, background: "#eef1f5", borderRadius: height, overflow: "hidden" }}>

          height: "100%",
          background: color,
          transition: "width .3s ease",
          borderRadius: height,
        }}
      />
    </div>
  );
}

/* ============================== UI: FILE UPLOAD BOX ============================== */

function FileUploadBox({ discipline, indicatorId, kind, files, person, onChanged, label }) {
  const inputRef = useRef(null);
  const [uploading, setUploading] = useState(false);
  const list = files || [];

  const handleFiles = async (fileList) => {
    if (!fileList.length) return;
    setUploading(true);
    try {
      await apiUploadFiles(discipline, indicatorId, kind, fileList, person);
      onChanged();
    } catch (e) {
      alert("上传失败，请检查网络后重试");
    }
    setUploading(false);
  };

  const removeFile = async (fileId) => {
    if (!confirm("确定删除该文件吗？")) return;
    try {
      await apiDeleteFile(fileId);
      onChanged();
    } catch (e) {
      alert("删除失败，请重试");
    }
  };

  return (
    <div style={{ marginTop: 10 }}>
      {list.map((f) => (
        <div
          key={f.id}
          style={{
            display: "flex",
            alignItems: "center",
            gap: 10,
            background: "#f7f9fc",
            border: "1px solid #e6e9ef",
            borderRadius: 8,
            padding: "8px 12px",
            marginBottom: 6,
            fontSize: 13,
          }}
        >
          <span style={{ fontSize: 15 }}>📎</span>
          <a
            href={f.url}
            target="_blank"
            rel="noreferrer"
            style={{ color: "#2f5fd9", flex: 1, textDecoration: "none", wordBreak: "break-all" }}
          >
            {f.name}
          </a>
          {f.uploadedBy && (
            <span style={{ color: "#a3adbd", fontSize: 11.5, flexShrink: 0 }}>{f.uploadedBy} 上传</span>
          )}
          <span style={{ color: "#8a94a6", fontSize: 12, flexShrink: 0 }}>{humanFileSize(f.size)}</span>
          <button
            onClick={() => removeFile(f.id)}
            style={{
              border: "none",
              background: "none",
              color: "#c23b3b",
              cursor: "pointer",
              fontSize: 13,
              flexShrink: 0,
            }}
          >
            删除
          </button>
        </div>
      ))}

      <div
        onDragOver={(e) => e.preventDefault()}
        onDrop={(e) => {
          e.preventDefault();
          if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
        }}
        onClick={() => inputRef.current && inputRef.current.click()}
        style={{
          border: "1.5px dashed #c7cedb",
          borderRadius: 8,
          padding: "10px 14px",
          textAlign: "center",
          fontSize: 12.5,
          color: "#8a94a6",
          cursor: "pointer",
          background: "#fafbfc",
        }}
      >
        {uploading ? "上传中..." : label}
        <input
          ref={inputRef}
          type="file"
          multiple
          style={{ display: "none" }}
          onChange={(e) => {
            if (e.target.files.length) handleFiles(e.target.files);
            e.target.value = "";
          }}
        />
      </div>
    </div>
  );
}

/* ============================== UI: TEXT FIELD (debounced save) ============================== */

function TextField({ discipline, indicatorId, itemIdx, value, person, onSaved, placeholder }) {
  const [local, setLocal] = useState(value || "");
  const [saving, setSaving] = useState(false);
  const timerRef = useRef(null);

  useEffect(() => {
    setLocal(value || "");
  }, [value]);

  const scheduleSave = (val) => {
    setLocal(val);
    if (timerRef.current) clearTimeout(timerRef.current);
    timerRef.current = setTimeout(async () => {
      setSaving(true);
      try {
        await apiSaveField(discipline, indicatorId, itemIdx, val, person);
        onSaved();
      } catch (e) {
        // silently retry on next keystroke; avoid noisy alerts while typing
      }
      setSaving(false);
    }, 700);
  };

  return (
    <div style={{ position: "relative" }}>
      <textarea
        value={local}
        onChange={(e) => scheduleSave(e.target.value)}
        placeholder={placeholder || "请填写..."}
        rows={2}
        style={{
          width: "100%",
          border: "1px solid #dde2ea",
          borderRadius: 8,
          padding: "8px 12px",
          fontSize: 13.5,
          fontFamily: "inherit",
          boxSizing: "border-box",
          resize: "vertical",
          outline: "none",
        }}
      />
      {saving && (
        <span style={{ position: "absolute", right: 8, top: 8, fontSize: 11, color: "#a3adbd" }}>
          保存中...
        </span>
      )}
    </div>
  );
}

    () => indicators.filter((i) => ownersFor(i, discipline).includes(person)),

    () => computePersonProgress(indicators, person, discipline, state.fields, state.evidence, state.listFiles),

  const grouped = useMemo(() => {

          borderRadius: 16,
          padding: "22px 26px",
          color: "#fff",
          marginBottom: 24,
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          flexWrap: "wrap",
          gap: 16,
        }}
      >
        <div>
          <div style={{ fontSize: 13, opacity: 0.8 }}>{disciplineName} · 负责人</div>
          <div style={{ fontSize: 24, fontWeight: 800 }}>{person}</div>
          <div style={{ fontSize: 13, opacity: 0.85, marginTop: 4 }}>
            共负责 {progress.indicatorCount} 项三级指标
          </div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 30, fontWeight: 800 }}>{pct}%</div>
          <div style={{ fontSize: 12.5, opacity: 0.85 }}>
            {progress.done}/{progress.total} 已完成
          </div>
          <div style={{ width: 160, marginTop: 6 }}>
            <div
              style={{
                height: 8,
                background: "rgba(255,255,255,0.25)",
                borderRadius: 8,
                overflow: "hidden",
              }}
            >
              <div style={{ width: `${pct}%`, height: "100%", background: "#fff", borderRadius: 8 }} />
            </div>
          </div>
        </div>
      </div>

      {grouped.map(([l1, list]) => (
        <div key={l1} style={{ marginBottom: 28 }}>
          <div
            style={{
              fontSize: 13,
              fontWeight: 700,
              color: "#8a94a6",
              letterSpacing: 1,
              marginBottom: 10,
              paddingLeft: 2,
            }}
          >
            {l1}
          </div>
          {list.map((ind) => (
            <IndicatorCard
              key={ind.id}
              ind={ind}
              discipline={discipline}
              person={person}
              state={state}
              onChanged={state.reload}
            />
          ))}
        </div>
      ))}
    </div>
  );
}

/* ============================== APP ROOT ============================== */

function App() {
  const { indicators, error: indicatorsError } = useIndicators();
  const [discipline, setDiscipline] = useState(null);
  const [person, setPerson] = useState(null);
  const [leader, setLeader] = useState(null);

  if (indicatorsError) {
    return (
      <div style={{ padding: 60, textAlign: "center", color: "#a83232", fontFamily: "sans-serif" }}>
        {indicatorsError}
      </div>
    );
  }

  if (!indicators) {
    return <div style={{ padding: 60, textAlign: "center", color: "#8a94a6" }}>正在连接服务器...</div>;
  }

  const isLeaderFlow = discipline === "__LEADER__";

  return (
    <div style={{ minHeight: "100vh", background: "#f4f6fa" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 50 }}>
        <DataScopeNotice />
        <DeadlineBanner />
      </div>
      {!discipline && <DisciplineSelect onSelect={setDiscipline} />}

      {isLeaderFlow && leader === null && (
        <LeaderSelect
          onSelect={setLeader}
          onBack={() => {
            setDiscipline(null);
            setLeader(null);
          }}
        />
      )}
      {isLeaderFlow && leader && (
        <LeaderDashboard leader={leader} onBack={() => setLeader(null)} />
      )}

      {discipline && !isLeaderFlow && person === null && (
        <PersonSelect
          indicators={indicators}
          discipline={discipline}
          onSelect={setPerson}
          onBackDiscipline={() => {
            setDiscipline(null);
            setPerson(null);
          }}
        />
      )}
      {discipline && !isLeaderFlow && person === "__ADMIN__" && (
        <ProgressDashboard
          indicators={indicators}
          discipline={discipline}
          onBack={() => setPerson(null)}
          onSelectPerson={(p) => setPerson(p)}
        />
      )}
      {discipline && !isLeaderFlow && person && person !== "__ADMIN__" && (
        <PersonWorkspace
          indicators={indicators}
          person={person}
          discipline={discipline}
          onBack={() => setPerson(null)}
        />
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<App />);

</script>

</body>
</html>
